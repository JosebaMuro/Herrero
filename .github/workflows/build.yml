name: Compilar Herrero (Android, Windows, Linux x64/ARM64 e iOS)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Análisis (solo errores)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: ONNX Runtime 1.20 (operadores del VLM)
        run: python3 scripts/ort_runtime.py android
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: FreeLLMAPI dentro del APK (Node.js de Termux como libnode.so)
        run: |
          pip install zstandard
          J=android/app/src/main/jniLibs/arm64-v8a
          python3 scripts/termux_fetch.py build/termux nodejs-lts ca-certificates
          grep -E '^nodejs' build/termux/PACKAGES.txt
          python3 scripts/android_node.py build/termux $J
          scripts/bundle_freellmapi.sh android-arm64 build/fl-android
          python3 scripts/android_node.py --pack build/fl-android/freellmapi build/termux/usr/etc/tls/cert.pem $J/libfreellmapi_app.so
          ls -la $J; du -sh $J
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk Herrero-android.apk
      # APK solo para móviles de 64 bits (casi todos desde 2017): bastante más ligero
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Herrero-android-arm64.apk
      - name: Comprobar que los APK piden internet (descarga de modelos IA)
        run: |
          AAPT2=$(ls ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/*/aapt2 | sort -V | tail -1)
          for a in Herrero-android.apk Herrero-android-arm64.apk; do
            "$AAPT2" dump permissions "$a"
            "$AAPT2" dump permissions "$a" | grep -q "android.permission.INTERNET" || { echo "::error::$a sin permiso INTERNET"; exit 1; }
          done
          # FreeLLMAPI: Node y su paquete dentro del APK
          for a in Herrero-android.apk Herrero-android-arm64.apk; do
            for f in lib/arm64-v8a/libnode.so lib/arm64-v8a/libfreellmapi_app.so; do
              unzip -l "$a" | grep -q " $f$" || { echo "::error::$a sin $f"; exit 1; }
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Herrero-android
          path: |
            Herrero-android.apk
            Herrero-android-arm64.apk

  android-freellmapi:
    # Node.js de Termux con las bibliotecas renombradas y FreeLLMAPI con node:sqlite,
    # arrancado de verdad en un emulador Android (x86_64, misma preparación que el APK).
    name: FreeLLMAPI en Android (emulador)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar Node (x86_64) y FreeLLMAPI
        run: |
          pip install zstandard
          TERMUX_ARCH=x86_64 python3 scripts/termux_fetch.py build/termux nodejs-lts ca-certificates
          python3 scripts/android_node.py build/termux build/jni
          scripts/bundle_freellmapi.sh android-arm64 build/fl-android
          python3 scripts/android_node.py --pack build/fl-android/freellmapi build/termux/usr/etc/tls/cert.pem build/jni/libfreellmapi_app.so
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/android_freellmapi_test.sh build/jni

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: ONNX Runtime 1.20 (operadores del VLM)
        run: python scripts/ort_runtime.py windows
      - run: flutter build windows --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: FreeLLMAPI dentro del paquete (Node.js + servidor)
        shell: bash
        run: scripts/bundle_freellmapi.sh win-x64 build/windows/x64/runner/Release
      - name: Probar FreeLLMAPI integrado (arranca, clave sola, /v1)
        shell: pwsh
        run: |
          $env:HERRERO_FREELLMAPI = (Resolve-Path build/windows/x64/runner/Release/freellmapi).Path
          flutter test test/freellmapi_embedded_test.dart
      - name: Comprobar ONNX Runtime con DirectML (GPU) y vuelta a CPU
        shell: pwsh
        run: |
          foreach ($f in 'onnxruntime.dll','DirectML.dll') {
            if (-not (Test-Path "build/windows/x64/runner/Release/$f")) { Write-Error "falta $f en el paquete"; exit 1 }
          }
          $env:HERRERO_ORT_DIR = (Resolve-Path build/windows/x64/runner/Release).Path
          $env:HERRERO_ORT_TEST = '1'
          $env:HERRERO_ORT_ENGINE = 'directml'
          flutter test test/accel_test.dart
      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Herrero-windows-portable.zip
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if ($ver -notmatch '^\d') { $ver = "1.0.${{ github.run_number }}" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver installer\herrero.iss
          Copy-Item installer\Output\Herrero-Setup.exe Herrero-windows-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Herrero-windows
          path: |
            Herrero-windows-setup.exe
            Herrero-windows-portable.zip

  linux:
    runs-on: ubuntu-22.04 # glibc 2.35: el binario vale para Ubuntu 22.04 LTS y posteriores
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de compilación (GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: ONNX Runtime 1.20 y cargador con el paquete CUDA
        run: python3 scripts/ort_runtime.py linux
      - run: flutter build linux --release
      - name: TUI de terminal (herrero-tui)
        run: scripts/build_tui.sh build/linux/x64/release/bundle/herrero-tui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: FreeLLMAPI dentro del paquete (Node.js + servidor)
        run: scripts/bundle_freellmapi.sh linux-x64 build/linux/x64/release/bundle
      - name: Probar FreeLLMAPI integrado (arranca, clave sola, /v1)
        run: HERRERO_FREELLMAPI=$PWD/build/linux/x64/release/bundle/freellmapi flutter test test/freellmapi_embedded_test.dart
      - name: Comprobar la TUI y ONNX Runtime del paquete
        run: |
          B=build/linux/x64/release/bundle
          ls -l $B $B/lib
          test -f $B/lib/libonnxruntime.so.1.15.1 || { echo "::error::falta ONNX Runtime en el paquete"; exit 1; }
          $B/herrero-tui --ayuda
          $B/herrero-tui --calcular "nave a dos aguas de 30 x 15 m, 6 m al alero, en Vitoria" --sin-ia --exportar /tmp/herrero-out
          ls -R /tmp/herrero-out
          # sin gráfica NVIDIA: diagnóstico sin errores y vuelta a CPU
          $B/herrero-tui --gpu --motor cpu
          # TUI interactiva en un terminal de verdad (pty, TERM=linux)
          python3 test/tui/pty_smoke.py $B/herrero-tui
      - name: Empaquetar
        run: |
          cp scripts/instalar-ubuntu.sh installer/linux/herrero.desktop installer/linux/LEEME.txt build/linux/x64/release/bundle/
          tar -C build/linux/x64/release -czf Herrero-linux-x64.tar.gz --transform 's,^bundle,herrero,' bundle
          cp scripts/instalar-ubuntu.sh instalar-herrero-ubuntu.sh
          ls -l Herrero-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: Herrero-linux
          path: |
            Herrero-linux-x64.tar.gz
            instalar-herrero-ubuntu.sh

  linux-arm64:
    # Raspberry Pi 4/5 con Raspberry Pi OS de 64 bits (Debian 12, glibc 2.36) y otros ARM64.
    # ubuntu-22.04-arm: glibc 2.35, así que el binario vale para Debian 12 y Ubuntu 22.04+.
    name: Linux ARM64 (.deb y .AppImage)
    runs-on: ubuntu-22.04-arm
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de compilación (GTK) y de prueba
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            curl git unzip xz-utils zip file xvfb desktop-file-utils
      # Flutter no publica un archivo del SDK para Linux ARM64: se clona la versión
      # y el propio `flutter` descarga el SDK de Dart de arm64 al arrancar.
      - name: Flutter ${{ env.FLUTTER_VERSION }} (arm64)
        run: |
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" config --no-analytics --enable-linux-desktop
          "$HOME/flutter/bin/flutter" --version
      - run: flutter pub get
      - name: ONNX Runtime 1.20 (aarch64) y cargador
        run: python3 scripts/ort_runtime.py linux
      - run: flutter build linux --release
      - name: TUI de terminal (herrero-tui)
        run: scripts/build_tui.sh build/linux/arm64/release/bundle/herrero-tui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: FreeLLMAPI dentro del paquete (Node.js + servidor, ARM64)
        run: scripts/bundle_freellmapi.sh linux-arm64 build/linux/arm64/release/bundle
      - name: Probar FreeLLMAPI integrado (arranca, clave sola, /v1)
        run: HERRERO_FREELLMAPI=$PWD/build/linux/arm64/release/bundle/freellmapi flutter test test/freellmapi_embedded_test.dart
      - name: Comprobar que todo es ARM64
        run: |
          B=build/linux/arm64/release/bundle
          for f in $B/herrero $B/herrero-tui $B/lib/libonnxruntime.so.1.15.1 $B/freellmapi/node/bin/node; do
            file -L "$f"
            file -L "$f" | grep -q "ARM aarch64" || { echo "::error::$f no es ARM64"; exit 1; }
          done
      - name: Empaquetar (.deb y .AppImage)
        run: scripts/package_linux.sh build/linux/arm64/release/bundle arm64 dist
      - name: Probar el .deb instalado
        run: |
          sudo apt-get install -y ./dist/Herrero-linux-arm64.deb
          herrero-tui --ayuda
          herrero-tui --calcular "marquesina para 2 coches de 5,5 x 5 m y 2,4 m de alto, panel sándwich, galvanizada" \
            --sin-ia --exportar /tmp/herrero-out
          ls -R /tmp/herrero-out
          herrero-tui --gpu --motor cpu
          python3 test/tui/pty_smoke.py /usr/bin/herrero-tui
      - name: Probar el .AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./dist/Herrero-linux-arm64.AppImage --tui --ayuda
          ./dist/Herrero-linux-arm64.AppImage --tui --calcular "barandilla de 6 m" --sin-ia | head -5
      - name: Arrancar la app de escritorio (Xvfb, 20 s)
        continue-on-error: true
        run: |
          set +e
          timeout 20 xvfb-run -a herrero; rc=$?
          echo "código de salida: $rc (124 = seguía abierta)"
          test $rc = 124
      - uses: actions/upload-artifact@v4
        with:
          name: Herrero-linux-arm64
          path: |
            dist/Herrero-linux-arm64.deb
            dist/Herrero-linux-arm64.AppImage

  instalador:
    name: Instalador de la suite en Ubuntu 24.04
    runs-on: ubuntu-24.04
    needs: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Herrero-linux
      - name: Instalar Herrero, Oficina y Prueba (venv compartido, modo terminal)
        run: |
          sudo scripts/instalar-ubuntu.sh --sin-menu --usuario "$USER" --proyectos herrero,oficina,prueba \
            --tarball Herrero-linux-x64.tar.gz --sin-nvidia --sin-modelos
      - name: Comprobar
        run: |
          set -x
          herrero-tui --calcular "marquesina para 3 coches en Burgos" --sin-ia | head -5
          ls /opt/suite/venv
          test "$(ls /opt/suite/venv | wc -l)" = 1   # Oficina y Prueba comparten un venv
          du -sh /opt/suite/venv/*
          for p in 8775 8765; do
            for i in $(seq 60); do curl -fsS -o /dev/null "http://127.0.0.1:$p/" && break; sleep 2; done
            curl -fsS -o /dev/null -w "puerto $p: HTTP %{http_code}\n" "http://127.0.0.1:$p/"
          done
          systemctl get-default | grep -q multi-user.target
          test -x /usr/local/bin/suite && test -x /usr/local/sbin/herrero-modo
          sudo -n /usr/local/sbin/herrero-modo tui   # regla de sudo sin contraseña
          cat ~/.profile ~/.bash_profile 2>/dev/null | grep -q "suite-tui"
          sudo scripts/instalar-ubuntu.sh --deshacer --usuario "$USER"
          systemctl get-default | grep -q graphical.target
      - name: Diagnóstico si falla
        if: failure()
        run: |
          sudo journalctl -u suite-oficina -u suite-prueba --no-pager | tail -60 || true

  ios:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: ONNX Runtime 1.20 (pod onnxruntime-objc)
        run: python3 scripts/ort_runtime.py ios
      # Sin firmar: se instala con Sideloadly o AltStore y un Apple ID gratuito, que lo firma.
      - run: flutter build ios --release --no-codesign
      - name: IPA sin firmar
        run: |
          grep -E "^  - onnxruntime-(objc|c) \(1\.20\.0\)" ios/Podfile.lock \
            || { echo "::error::el pod de ONNX Runtime no es 1.20.0"; grep -i onnxruntime ios/Podfile.lock; exit 1; }
          nm -gU build/ios/iphoneos/Runner.app/Runner | grep -q " _OrtGetApiBase$" \
            || { echo "::error::ONNX Runtime no está exportado en el ejecutable"; exit 1; }
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Herrero-ios.ipa Payload
          ls -l Herrero-ios.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Herrero-ios
          path: Herrero-ios.ipa

  release:
    # iOS y Linux ARM64 no bloquean la publicación de Android, Windows y Linux x64 si fallan
    if: >-
      always() && needs.android.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]'))
    needs: [android, windows, linux, linux-arm64, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Documentación y código fuente
        run: |
          cp docs/manual-de-usuario.md dist/Herrero-manual-de-usuario.md
          cp docs/documentacion-tecnica.md dist/Herrero-documentacion-tecnica.md
          git archive --format=zip --prefix=Herrero-src/ -o dist/Herrero-codigo-fuente.zip HEAD
          ls -l dist
      # Etiqueta v<versión>-<letra>: cada corrección de la misma versión sigue el abecedario
      # (v4.3.0-b71 -> v4.3.0-c -> v4.3.0-d…); una versión nueva empieza en «a».
      # Las releases antiguas llevaban además el número de compilación (b71): se ignora.
      - name: Versión
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT; exit 0; fi
          ver=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          last=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name' \
                 | sed -n "s/^v${ver//./\\.}-\([a-z]\)[0-9]*$/\1/p" | sort | tail -1)
          case "$last" in
            "") letra=a ;;
            z) echo "::error::v$ver ya llegó a la z: sube la versión en pubspec.yaml"; exit 1 ;;
            *) letra=$(echo "$last" | tr 'a-y' 'b-z') ;;
          esac
          echo "v$ver: última letra «${last:-ninguna}», esta release: v$ver-$letra"
          echo "tag=v$ver-$letra" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Herrero ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
