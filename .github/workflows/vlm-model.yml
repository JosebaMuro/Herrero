name: Modelo VLM (lectura de croquis)

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/prepare_vlm.py
      - .github/workflows/vlm-model.yml

permissions:
  contents: write

jobs:
  vlm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir "transformers==4.48.3" "onnx==1.17.0" "onnxruntime==1.20.1" "numpy<2.2" pillow huggingface_hub tokenizers
      - name: Descargar SmolVLM-256M (ONNX int8) y generar referencia
        run: python scripts/prepare_vlm.py
      - name: Verificar con ONNX Runtime 1.15 (el de la app)
        run: |
          pip install --no-cache-dir --force-reinstall "onnxruntime==1.15.1" "numpy<2"
          python - <<'PY'
          import glob, site, struct
          for p in glob.glob(site.getsitepackages()[0] + "/onnxruntime/capi/*.so"):
              with open(p, "r+b") as f:
                  h = f.read(64)
                  phoff = struct.unpack_from("<Q", h, 0x20)[0]
                  phentsize, phnum = struct.unpack_from("<HH", h, 0x36)
                  for i in range(phnum):
                      off = phoff + i * phentsize
                      f.seek(off)
                      ptype, pflags = struct.unpack("<II", f.read(8))
                      if ptype == 0x6474E551 and pflags & 1:
                          f.seek(off + 4)
                          f.write(struct.pack("<I", pflags & ~1))
          PY
          python scripts/prepare_vlm.py --verify
      - name: Publicar en release de modelos VLM
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-vlm-v1
          name: Modelo VLM – lectura de croquis (v1)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Modelo de visión y lenguaje local para "Importar plano" de Herrero (croquis a mano y planos complejos).
            SmolVLM-256M-Instruct de Hugging Face (licencia Apache-2.0), ONNX cuantizado a 8 bits (uint8) tal como lo publica transformers.js.
            Descarga desde la app → Modelos IA.
          files: out_vlm/*
