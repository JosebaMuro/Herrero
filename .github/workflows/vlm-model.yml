name: Modelo VLM (lectura de croquis)

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/prepare_vlm.py
      - .github/workflows/vlm-model.yml

permissions:
  contents: write

jobs:
  vlm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir "transformers==4.48.3" "onnx==1.17.0" "onnxruntime==1.20.1" "numpy<2.2" pillow huggingface_hub tokenizers
      - name: Descargar SmolVLM 256M y 500M (ONNX uint8) y generar referencia
        run: python scripts/prepare_vlm.py
      - name: Verificar en un proceso nuevo (ORT 1.20.1, el de la app)
        run: python scripts/prepare_vlm.py --verify
      - name: Publicar en release de modelos VLM
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-vlm-v1
          name: Modelo VLM – lectura de croquis (v1)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Modelo de visión y lenguaje local para "Importar plano" de Herrero (croquis a mano y planos complejos).
            SmolVLM-256M-Instruct (móvil) y SmolVLM-500M-Instruct (PC) de Hugging Face (licencia Apache-2.0),
            ONNX cuantizado a 8 bits (uint8) tal como lo publica transformers.js. Necesita ONNX Runtime 1.17 o
            posterior (la app lleva el 1.20).
            Descarga desde la app → Modelos IA.
          files: out_vlm/*
