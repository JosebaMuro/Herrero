name: Convertir modelo IA (SD-Turbo → ONNX int8)

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/convert_sd_turbo.py
      - .github/workflows/convert-model.yml

permissions:
  contents: write

concurrency:
  group: convert-model
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir "diffusers==0.31.0" "transformers==4.46.3" "onnx==1.17.0" "onnxruntime==1.20.1" "numpy<2.2" pillow accelerate safetensors huggingface_hub
      - name: Convertir y probar
        run: python scripts/convert_sd_turbo.py
      - name: Verificar con ONNX Runtime 1.15 (el de la app)
        run: |
          pip install --no-cache-dir --force-reinstall "onnxruntime==1.15.1" "numpy<2"
          # ORT 1.15 marca la pila como ejecutable y el glibc actual lo rechaza: se limpia la marca
          python - <<'EOF'
          import glob, site, struct
          for p in glob.glob(site.getsitepackages()[0] + "/onnxruntime/capi/*.so"):
              with open(p, "r+b") as f:
                  h = f.read(64)
                  phoff = struct.unpack_from("<Q", h, 0x20)[0]
                  phentsize, phnum = struct.unpack_from("<HH", h, 0x36)
                  for i in range(phnum):
                      off = phoff + i * phentsize
                      f.seek(off)
                      ptype, pflags = struct.unpack("<II", f.read(8))
                      if ptype == 0x6474E551 and pflags & 1:
                          f.seek(off + 4)
                          f.write(struct.pack("<I", pflags & ~1))
                          print("execstack limpiado en", p)
          EOF
          python scripts/convert_sd_turbo.py --verify
      - uses: actions/upload-artifact@v4
        with:
          name: muestras
          path: out/sample_*.png
      - name: Publicar en release de modelos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-sdturbo-v1
          name: Modelos IA – SD-Turbo int8 (v1)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Modelos para la "Foto IA" local de Herrero (descarga desde la app → Ajustes → Modelos IA).
            Basados en stabilityai/sd-turbo (licencia de Stability AI; revisa sus condiciones antes de un uso comercial)
            y en el autoencoder diminuto madebyollin/taesd (licencia MIT).
            Convertidos a ONNX y cuantizados a int8 por `scripts/convert_sd_turbo.py`.
          files: out/*
