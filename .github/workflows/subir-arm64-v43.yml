# Única vez: sube el .deb y el .AppImage de Linux ARM64 (compilados por el CI del PR #17,
# run 45558192222, mismo código de la app que v4.3.0) al release ya publicado v4.3.0-b71.
# Desde el entorno de Claude no se pueden descargar artefactos; se borra después de usarlo.
name: Subir Linux ARM64 a v4.3.0-b71
on:
  push:
    branches: [claude/project-thread-ezfs1j]
    paths: [.github/workflows/subir-arm64-v43.yml]
permissions:
  contents: write
  actions: read
jobs:
  subir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Herrero-linux-arm64
          run-id: 45558192222
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Comprobar y subir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          dpkg-deb -f dist/Herrero-linux-arm64.deb Package Version Architecture Depends
          dpkg-deb -f dist/Herrero-linux-arm64.deb Depends | grep -Eqv 'temurin|jdk'
          file dist/Herrero-linux-arm64.AppImage | grep -q "ARM aarch64"
          sha256sum dist/*
          gh release upload v4.3.0-b71 dist/Herrero-linux-arm64.deb dist/Herrero-linux-arm64.AppImage \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view v4.3.0-b71 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
