name: Modelos de comprensión y razonamiento en castellano

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/prepare_reason_es.py
      - .github/workflows/reason-es-model.yml

permissions:
  contents: write

jobs:
  reason-es:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Liberar disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: pip install --no-cache-dir "onnx==1.17.0" "onnxruntime==1.20.1" "numpy<2.2" huggingface_hub tokenizers
      - name: jina-embeddings-v2-base-es y Qwen3-4B-Thinking-2507 (razonamiento) con ORT 1.20.1
        run: python scripts/prepare_reason_es.py
      - name: Quitar de la release los ficheros de SmolLM3 (descartado)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view models-reason-es-v1 --json assets -q '.assets[].name' 2>/dev/null | grep '^smollm3' \
            | xargs -r -I{} gh release delete-asset models-reason-es-v1 {} -y || true
      - name: Publicar en release de modelos en castellano
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-reason-es-v1
          name: Comprensión y razonamiento en castellano (v1)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Alternativa en castellano a la comprensión y el razonamiento locales de Herrero (sin internet una vez descargados).
            - jina-embeddings-v2-base-es (Jina AI, Apache-2.0): embeddings castellano-inglés en lugar de los multilingües de e5-small.
            - Qwen3-4B-Thinking-2507 (Alibaba Qwen, Apache-2.0): LLM que razona en castellano antes de rellenar la ficha. Pesos de 4 bits, para PC.
            Necesita ONNX Runtime 1.20 (incluido en la app). Descarga desde la app → Modelos IA.
          files: out_reason_es/*

  # Otros candidatos con las mismas descripciones, sin publicar (SmolLM3-3B se descartó así).
  candidato:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Liberar disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: pip install --no-cache-dir "onnx==1.17.0" "onnxruntime==1.20.1" "numpy<2.2" huggingface_hub tokenizers
      - name: Qwen3-1.7B (int8) razonando, con las mismas descripciones
        run: python scripts/prepare_reason_es.py --eval onnx-community/Qwen3-1.7B-ONNX onnx/model_quantized.onnx
